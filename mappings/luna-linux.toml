#
# LUNA (Universal Audio) keyboard shortcuts -> REAPER, Linux target.
#
# Source of the LUNA side: the published macOS default shortcut set. LUNA
# inherits nearly all of it from Pro Tools, including the whole single-letter
# "Commands Keyboard Focus" block (T/R zoom, A/S trim, D/G fades, Q/W scroll,
# [/] bar nav, , . M / nudge, B separate, E frame).
#
# Modifier translation for a Linux target:
#     Cmd     -> Ctrl
#     Opt     -> Alt
#     Control -> Super        (matches Pro Tools' own Windows convention)
#
# Every `action` / `macro` command ID below is validated at build time against
# the action list dumped straight out of REAPER 7.78, so nothing here is a guess
# about what REAPER calls things.
#
# status = "unmapped"  ->  deliberately left alone; see the comment for why.
#

[meta]
name = "LUNA / Pro Tools keys for REAPER"
target = "linux"
reaper_version = "7.78"
notes = [
  "Cmd->Ctrl, Opt->Alt, LUNA's Mac Control->Super.",
  "Super combos may be intercepted by GNOME before REAPER sees them.",
]

# ---------------------------------------------------------------------------
# Transport
# ---------------------------------------------------------------------------

[[binding]]
luna = "Toggle Playback"
key = "Space"
action = 40044

[[binding]]
luna = "Toggle Record"
key = "Ctrl+Space"
action = 1013

[[binding]]
luna = "Toggle Record (numpad)"
key = "Num3"
action = 1013

[[binding]]
luna = "Loop Playback"
key = "Super+L"
action = 1068

[[binding]]
luna = "Loop Playback (numpad)"
key = "Num4"
action = 1068

[[binding]]
luna = "Return To Zero"
key = "Return"
action = 40042

[[binding]]
luna = "Toggle Pre/Post Roll"
key = "Ctrl+K"
action = 41818
comment = "REAPER splits pre-roll into play vs record; this is the play one."

[[binding]]
luna = "Toggle Metronome"
key = "K"
action = 40364

[[binding]]
luna = "Toggle Metronome (numpad)"
key = "Num7"
action = 40364

[[binding]]
luna = "Toggle Count In"
key = "Shift+K"
action = 41819
comment = "REAPER models count-in as pre-roll on record."

[[binding]]
luna = "Toggle Count In (numpad)"
key = "Num8"
action = 41819

[[binding]]
luna = "Auto Scroll"
key = "Shift+A"
action = 41817

[[binding]]
luna = "Create Marker"
key = "NumEnter"
status = "unmapped"
comment = """LUNA puts this on numpad Enter and Return To Zero on Return. \
REAPER on Linux reports both as VK_RETURN, so binding it would steal RTZ. \
Needs an empirical check on the actual keyboard before it can be mapped."""

[[binding]]
luna = "Restart Playback"
key = "Super+Alt+Ctrl+Space"
status = "unmapped"
comment = "No single native REAPER equivalent worth guessing at."

