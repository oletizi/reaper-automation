comment = "Plain move collapses the razor area: move cursor, clear all razor areas, unselect all items (40289) so a stale item selection can't fall through to the next razor-aware plain op."

[[binding]]
luna = "Move Selection to Previous Bar (numpad)"
key = "Num1"
macro = [41043, 42406, 40289]
comment = "Plain move collapses the razor area: move cursor, clear all razor areas, unselect all items (40289) so a stale item selection can't fall through to the next razor-aware plain op."

[[binding]]
luna = "Move Selection To Next Clip Edge"
key = "'"
macro = [41168, 42406, 40289]
comment = """Must be the "nearest item edge" pair (41167/41168), NOT "edge of item" \
(40318/40319). The latter only walks the edges of *selected* items, so with a clip \
selected it ping-pongs on that one clip and never crosses to the next -- verified \
empirically. 41167/41168 ignore item selection and leave it untouched, which is what \
Pro Tools tab-to-boundary does. Plain move collapses the razor area: move cursor, \
clear all razor areas, unselect all items (40289) so a stale item selection can't \
fall through to the next razor-aware plain op."""

[[binding]]
luna = "Move Selection To Previous Clip Edge"
key = "L"
macro = [41167, 42406, 40289]
comment = "Plain move collapses the razor area: move cursor, clear all razor areas, unselect all items (40289) so a stale item selection can't fall through to the next razor-aware plain op."

[[binding]]
luna = "Move Selection To Next Transient"
key = "Tab"
macro = [40375, 42406, 40289]
comment = "Plain move collapses the razor area: move cursor, clear all razor areas, unselect all items (40289) so a stale item selection can't fall through to the next razor-aware plain op."

[[binding]]
luna = "Move Selection To Next Transient (alt)"
key = "Opt+'"
macro = [40375, 42406, 40289]
comment = "Plain move collapses the razor area: move cursor, clear all razor areas, unselect all items (40289) so a stale item selection can't fall through to the next razor-aware plain op."

[[binding]]
luna = "Move Selection To Previous Transient"
key = "Opt+L"
macro = [40376, 42406, 40289]
comment = """LUNA also puts this on Alt+Tab, which GNOME intercepts on Linux. Plain \
move collapses the razor area: move cursor, clear all razor areas, unselect all \
items (40289) so a stale item selection can't fall through to the next \
razor-aware plain op."""

[[binding]]
luna = "Move Selection To Next Marker"
key = "Control+Opt+'"
macro = [40173, 42406, 40289]
comment = "Plain move collapses the razor area: move cursor, clear all razor areas, unselect all items (40289) so a stale item selection can't fall through to the next razor-aware plain op."

[[binding]]
luna = "Move Selection To Previous Marker"
key = "Control+Opt+L"
macro = [40172, 42406, 40289]
comment = "Plain move collapses the razor area: move cursor, clear all razor areas, unselect all items (40289) so a stale item selection can't fall through to the next razor-aware plain op."

[[binding]]
luna = "Extend Selection To Next Transient"
key = "Shift+Tab"
action = 40802

[[binding]]
luna = "Loop Select"
key = "Cmd+Shift+L"
action = 40622
comment = "Move loop points to time selection."

# --- Extend Selection: LUNA's "hold Shift while moving the transport" ---------
#
# Each of these generates a small ReaScript that moves the edit cursor with the
# given action, then stretches the razor edit area to follow it while keeping
# the far edge anchored -- so repeated presses keep growing the area. The area
# is painted onto the currently selected tracks (see razor-extend-template.ts).
#
# This cannot be a custom action. A macro would re-anchor on every press: from
# bar 2, Shift+] twice would give you bar 3-4 instead of bar 2-4. Verified
# against REAPER directly. The scripts need no extensions -- Lua ships with it.

[[binding]]
luna = "Extend Selection To Next Bar"
key = "Shift+]"
razor_extend = 41042

[[binding]]
luna = "Extend Selection To Next Bar (numpad)"
key = "Shift+Num2"
razor_extend = 41042

[[binding]]
luna = "Extend Selection To Previous Bar"
key = "Shift+["
razor_extend = 41043

[[binding]]
luna = "Extend Selection To Previous Bar (numpad)"
key = "Shift+Num1"
razor_extend = 41043

[[binding]]
luna = "Extend Selection To Next Clip Edge"
key = "Shift+'"
razor_extend = 41168

[[binding]]
luna = "Extend Selection To Previous Clip Edge"
key = "Shift+L"
razor_extend = 41167

[[binding]]
luna = "Extend Selection To Previous Transient"
key = "Opt+Shift+L"
razor_extend = 40376
comment = """LUNA also puts this on Alt+Shift+Tab, which GNOME intercepts. \
Forward is Shift+Tab, which REAPER covers natively with 40802."""

[[binding]]
luna = "Extend Selection To Next Marker"
key = "Control+Opt+Shift+'"
razor_extend = 40173

[[binding]]
luna = "Extend Selection To Previous Marker"
key = "Control+Opt+Shift+L"
razor_extend = 40172

[[binding]]
luna = "Extend Selection To Session Start"
key = "Shift+Return"
razor_extend = 40042

[[binding]]
luna = "Extend Selection To Session End"
key = "Opt+Shift+Return"
razor_extend = 40043

