# ---------------------------------------------------------------------------
# Edit
# ---------------------------------------------------------------------------

[[binding]]
luna = "Undo"
key = "Cmd+Z"
action = 40029

[[binding]]
luna = "Redo"
key = "Cmd+Shift+Z"
action = 40030

[[binding]]
luna = "Cut"
key = "Cmd+X"
action = 40699
comment = "Cut is razor-aware: acts directly on the razor edit area."

[[binding]]
luna = "Cut (Commands Focus)"
key = "X"
action = 40699
comment = "Cut is razor-aware: acts directly on the razor edit area."

[[binding]]
luna = "Copy"
key = "Cmd+C"
razor = 40057
comment = """Changed from 41383 to 40057 -- tower testing could not get a definitive \
paste-based confirmation either way (headless tower has no X display; item paste \
triggers GDK clipboard/window-context calls that fail there for every copy \
candidate tried, 41383/40057/40698 alike -- see final-fixwave-report.md). \
Switched on the strength of the action names themselves: 41383 is 'Edit: Copy ... \
within time selection, if any (smart copy)' -- the exact same 'depends on a real \
project time selection' shape already proven to be a no-op under razor= for 40916 \
(razor= / 42957 only ever sets item selection, never a time selection). 40057 is \
'Edit: Copy ... ignoring time selection' -- unconditional on the selected items, \
matching the razor= materialize-then-act pattern used everywhere else in this file."""

[[binding]]
luna = "Copy (Commands Focus)"
key = "C"
razor = 40057
comment = """Changed from 41383 to 40057 -- see the Copy (Cmd+C) binding's comment \
for the full rationale."""

[[binding]]
luna = "Paste"
key = "Cmd+V"
action = 42398
comment = """Left as a plain action -- confirm. Paste inserts clipboard content at \
the edit point; it doesn't operate on a pre-existing selection the way the other \
item ops here do, so pre-selecting the razor's items first wouldn't change what \
gets pasted or where."""

[[binding]]
luna = "Paste (Commands Focus)"
key = "V"
action = 42398
comment = """Left as a plain action -- confirm. Paste inserts clipboard content at \
the edit point; it doesn't operate on a pre-existing selection the way the other \
item ops here do, so pre-selecting the razor's items first wouldn't change what \
gets pasted or where."""

[[binding]]
luna = "Clear"
# On macOS the main delete key is Backspace (VK 8); Forward Delete (fn+delete)
# is a separate key. Pro Tools/LUNA "Clear" lives on the main delete key, so
# the whole delete family binds to Backspace. This also overrides ReaTooled's
# Backspace binding (its Smart Remove script), which is the key you actually press.
key = "Backspace"
action = 40006
comment = "Delete is razor-aware: acts directly on the razor edit area."

[[binding]]
luna = "Duplicate selection"
key = "Cmd+D"
razor = 41295

[[binding]]
luna = "Shift Clear (ripple delete)"
key = "Shift+Backspace"
action = 40201
comment = """Left as a plain action -- confirm. 40201 operates on the whole time \
selection across all tracks (not scoped to selected tracks), so wrapping it in \
razor= (select razor's items, then run) would not actually confine it to the \
razor area's vertical (track) scope."""

[[binding]]
luna = "Mute Selection"
key = "Cmd+M"
razor = 40175

[[binding]]
luna = "Create Fades"
key = "Cmd+F"
action = 40916
comment = """Left as a plain action -- confirmed on tower. 40916 (Item: Crossfade \
items within time selection) only creates fades when there is an actual project \
time selection AND the items are selected; it ignores the razor edit area \
entirely. Pre-selecting the razor's items via razor= (42957) does not supply a \
time selection, so razor=40916 behaved identically to plain 40916 (a no-op) in \
tower testing -- neither confines the crossfade to the razor'd tracks."""

[[binding]]
luna = "Fade To Clip Start (Fade In)"
key = "D"
razor = 40509

[[binding]]
luna = "Fade To Clip Stop (Fade Out)"
key = "G"
razor = 40510

[[binding]]
luna = "Trim From Clip Start"
key = "A"
razor = 41305

[[binding]]
luna = "Trim From Clip End"
key = "S"
razor = 41311

[[binding]]
luna = "Trim Clip to Selection"
key = "Cmd+T"
razor = 40508
comment = "Trims selected items -- same family as Trim From Clip Start/End."

[[binding]]
luna = "Separate Selection"
key = "Cmd+E"
# Split at the razor area if one exists, else at the edit cursor (playhead).
# A bare 40061 errors without a razor/time selection, so this is a script.
separate = true

[[binding]]
luna = "Separate Selection (Commands Focus)"
key = "B"
separate = true

[[binding]]
luna = "Consolidate Selection"
key = "Opt+Shift+3"
razor = 41588
comment = "Glue, expanding to time selection if any -- an item op on the selected items."

[[binding]]
luna = "Heal Separation"
key = "Cmd+H"
razor = 40548
comment = "Materializes the razor's items via the razor= select-then-act prelude, then heals the splits."

[[binding]]
luna = "Export Mixdown"
key = "Opt+Cmd+B"
action = 40015

[[binding]]
luna = "Shift Cut / Shift Paste / Shift Duplicate / Shift Insert"
key = "Shift+X"
status = "unmapped"
comment = """LUNA's "Shift" edit family is ripple editing. REAPER models ripple \
as a persistent mode (1162 toggle) rather than per-operation variants, so these \
want a design decision rather than a one-to-one binding."""

